<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHUVIS // NEURAL_LINK</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        :root {
            --bg: #050505;
            --neon-yellow: #fde047;
            --neon-cyan: #06b6d4;
            --neon-green: #10b981;
            --neon-pink: #ec4899;
            --neon-purple: #8b5cf6;
        }

        body {
            margin: 0;
            background-color: var(--bg);
            color: white;
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            border: 4px solid var(--neon-yellow);
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 40px;
            text-align: center;
            position: relative;
        }

        .glitch-title {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--neon-yellow);
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-bottom: 10px;
            text-shadow: 2px 2px var(--neon-pink);
        }

        .status-bar {
            font-size: 0.9rem;
            color: var(--neon-cyan);
            margin-bottom: 40px;
            border-bottom: 1px solid var(--neon-cyan);
            padding-bottom: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .cyber-btn {
            background: transparent;
            border: 2px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 20px;
            font-size: 1rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            position: relative;
        }

        .cyber-btn:hover {
            background: var(--neon-cyan);
            color: black;
            box-shadow: 0 0 20px var(--neon-cyan);
        }

        .cyber-btn.pro { border-color: var(--neon-green); color: var(--neon-green); }
        .cyber-btn.pro:hover { background: var(--neon-green); color: black; box-shadow: 0 0 20px var(--neon-green); }

        .cyber-btn.sonnet { border-color: var(--neon-pink); color: var(--neon-pink); }
        .cyber-btn.sonnet:hover { background: var(--neon-pink); color: black; box-shadow: 0 0 20px var(--neon-pink); }

        .cyber-btn.opus { border-color: var(--neon-purple); color: var(--neon-purple); }
        .cyber-btn.opus:hover { background: var(--neon-purple); color: black; box-shadow: 0 0 20px var(--neon-purple); }

        #log {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #444;
            height: 20px;
        }

        .scanline {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.1);
            animation: scan 4s linear infinite;
            pointer-events: none;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }
    </style>
</head>
<body>
    <div class="scanline"></div>
    <div class="container">
        <div class="glitch-title">SHUVIS_OS</div>
        <div class="status-bar">NEURAL_LINK: ACTIVE // AUTH: JUNGO</div>
        
        <div class="grid">
            <button class="cyber-btn" onclick="send('google-antigravity/gemini-3-flash', 'FLASH.v3')">FLASH.v3</button>
            <button class="cyber-btn pro" onclick="send('google-antigravity/gemini-3-pro', 'PRO.v3')">PRO.v3</button>
            <button class="cyber-btn sonnet" onclick="send('anthropic/claude-sonnet-4-5', 'SONNET.4.5')">SONNET.4.5</button>
            <button class="cyber-btn opus" onclick="send('google-antigravity/claude-opus-4-5-thinking', 'OPUS.4.5')">OPUS.4.5</button>
        </div>

        <div id="log">>>> WAITING_FOR_INPUT...</div>
    </div>

    <script>
        function send(id, name) {
            const log = document.getElementById('log');
            log.innerText = `>>> INITIALIZING_${name}...`;
            log.style.color = 'var(--neon-yellow)';

            if (window.clawdbotSendUserAction) {
                window.clawdbotSendUserAction({
                    name: 'change_model',
                    context: { modelId: id, modelName: name }
                });
                setTimeout(() => {
                    log.innerText = `>>> ${name}_LINK_ESTABLISHED`;
                    log.style.color = 'var(--neon-green)';
                }, 1000);
            } else {
                navigator.clipboard.writeText(`/model ${id}`).then(() => {
                    log.innerText = `>>> CMD_COPIED_TO_BUFFER`;
                });
            }
        }
    </script>
</body>
</html>
