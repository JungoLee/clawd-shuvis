<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>슈비스 모델 대시보드</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-flash: #38bdf8;
            --accent-pro: #4ade80;
            --accent-sonnet: #fb923c;
            --accent-opus: #a855f7;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .dashboard {
            width: 95%;
            max-width: 400px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 8px;
            font-weight: 700;
            background: linear-gradient(to right, #60a5fa, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-bottom: 24px;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .model-btn {
            position: relative;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            overflow: hidden;
        }

        .model-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            filter: brightness(1.1);
        }

        .model-btn:active {
            transform: translateY(0);
        }

        .flash { background-color: var(--accent-flash); }
        .pro { background-color: var(--accent-pro); }
        .sonnet { background-color: var(--accent-sonnet); }
        .opus { background-color: var(--accent-opus); }

        .status-msg {
            margin-top: 20px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            height: 1.2em;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <h1>슈비스 대시보드</h1>
        <p>전환할 모델을 선택해주세요</p>

        <div class="button-group">
            <button class="model-btn flash" onclick="changeModel('google-antigravity/gemini-3-flash', 'Gemini 3 Flash')">
                ⚡ Gemini 3 Flash
            </button>
            <button class="model-btn pro" onclick="changeModel('google-antigravity/gemini-3-pro', 'Gemini 3 Pro')">
                🧠 Gemini 3 Pro
            </button>
            <button class="model-btn sonnet" onclick="changeModel('anthropic/claude-sonnet-4-5', 'Claude 4.5 Sonnet')">
                🎨 Claude 4.5 Sonnet
            </button>
            <button class="model-btn opus" onclick="changeModel('google-antigravity/claude-opus-4-5-thinking', 'Claude 4.5 Opus')">
                🔮 Claude 4.5 Opus
            </button>
        </div>

        <div id="status" class="status-msg">🟢 자동 실행 준비 완료</div>
    </div>

    <script>
        function changeModel(modelId, modelName) {
            const status = document.getElementById('status');
            status.innerText = `${modelName} 전환 중...`;
            
            if (window.clawdbotSendUserAction) {
                window.clawdbotSendUserAction({
                    name: 'change_model',
                    surfaceId: 'main',
                    context: { modelId: modelId, modelName: modelName }
                });
                status.innerText = `🚀 ${modelName} 완료!`;
                status.style.color = '#4ade80';
            } else {
                navigator.clipboard.writeText(`/model ${modelId}`).then(() => {
                    alert(`자동 실행 미연결\n명령어가 복사되었습니다: /model ${modelId}`);
                });
            }
            
            setTimeout(() => {
                status.innerText = '🟢 자동 실행 준비 완료';
                status.style.color = '#94a3b8';
            }, 3000);
        }
    </script>
</body>
</html>
