<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>슈비스 모델 대시보드</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-flash: #38bdf8;
            --accent-pro: #4ade80;
            --accent-sonnet: #fb923c;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .dashboard {
            width: 90%;
            max-width: 400px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 8px;
            font-weight: 700;
            background: linear-gradient(to right, #60a5fa, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-bottom: 32px;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .model-btn {
            position: relative;
            padding: 18px;
            border: none;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            overflow: hidden;
        }

        .model-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.1);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .model-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        .model-btn:hover::before {
            opacity: 1;
        }

        .model-btn:active {
            transform: translateY(0);
        }

        .flash { background-color: var(--accent-flash); box-shadow: 0 4px 14px 0 rgba(56, 189, 248, 0.39); }
        .pro { background-color: var(--accent-pro); box-shadow: 0 4px 14px 0 rgba(74, 222, 128, 0.39); }
        .sonnet { background-color: var(--accent-sonnet); box-shadow: 0 4px 14px 0 rgba(251, 146, 60, 0.39); }

        .status-msg {
            margin-top: 24px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            height: 1.2em;
        }

        .icon {
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <h1>슈비스 대시보드</h1>
        <p>전환할 모델을 선택해주세요</p>

        <div class="button-group">
            <button class="model-btn flash" onclick="changeModel('google-antigravity/gemini-3-flash', 'Gemini 3 Flash')">
                <span class="icon">⚡</span> Gemini 3 Flash
            </button>
            <button class="model-btn pro" onclick="changeModel('google-antigravity/gemini-1.5-pro', 'Gemini 1.5 Pro')">
                <span class="icon">🧠</span> Gemini 1.5 Pro
            </button>
            <button class="model-btn sonnet" onclick="changeModel('anthropic/claude-sonnet-4-5', 'Claude 3.5 Sonnet')">
                <span class="icon">🎨</span> Claude 3.5 Sonnet
            </button>
        </div>

        <div id="status" class="status-msg">준비됨</div>
    </div>

    <script>
        function changeModel(modelId, modelName) {
            const status = document.getElementById('status');
            const command = `/model ${modelId}`;
            status.innerText = `${modelName} 전환 요청 중...`;
            
            if (window.clawdbotSendUserAction) {
                window.clawdbotSendUserAction({
                    name: 'change_model',
                    surfaceId: 'main',
                    context: { modelId: modelId, modelName: modelName }
                });
                status.innerText = `${modelName}로 전환되었습니다!`;
                status.style.color = '#4ade80';
            } else {
                // 브릿지가 없을 경우 클립보드에 복사
                navigator.clipboard.writeText(command).then(() => {
                    status.innerText = `명령어 복사됨! 채팅창에 붙여넣으세요.`;
                    status.style.color = '#38bdf8';
                }).catch(() => {
                    status.innerText = `명령어: ${command}`;
                    status.style.color = '#f87171';
                });
            }
            
            setTimeout(() => {
                status.innerText = '준비됨';
                status.style.color = '#94a3b8';
            }, 4000);
        }
    </script>
</body>
</html>
